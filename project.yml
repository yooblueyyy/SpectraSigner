# Generate the Xcode project with: xcodegen generate
name: SpectraSigner

options:
  bundleIdPrefix: dev.spectra
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  ZSignKit:
    path: Packages/ZSignKit
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  SpectraSigner:
    type: application
    platform: iOS
    sources:
      - path: App
      # server.p12 + commonName.txt for the on-device install server (scripts/fetch-server-cert.sh)
      - path: Resources
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SpectraSigner
        PRODUCT_BUNDLE_IDENTIFIER: dev.spectra.SpectraSigner
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: ZSignKit
        product: ZSignC
      - package: ZIPFoundation
    scheme:
      testTargets: []
