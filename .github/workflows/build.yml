name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project SpectraSigner.xcodeproj \
            -scheme SpectraSigner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || {
              echo "::group::Errors"
              grep -E "error:|fatal error" -A 3 build.log | head -200
              echo "::endgroup::"
              tail -40 build.log
              exit 1
            }
          grep -c "warning:" build.log || true

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          codesign --force --sign - --timestamp=none out/Payload/*.app
          (cd out && zip -qry ../SpectraSigner.ipa Payload)
          ls -lh SpectraSigner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpectraSigner
          path: SpectraSigner.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpectraSigner.ipa
          generate_release_notes: true
